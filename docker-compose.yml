services:
  qchat-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: qchat-bot:latest
    container_name: qchat-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
